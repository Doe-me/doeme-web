version: '3.8'

services:
  # Frontend Vue.js - Desenvolvimento
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: doe-me-frontend-dev
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - doe-me-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Vue.js - Produção
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: doe-me-frontend-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - doe-me-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - production

  # Nginx Reverse Proxy (opcional para desenvolvimento)
  nginx:
    image: nginx:alpine
    container_name: doe-me-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend-dev
    networks:
      - doe-me-network
    restart: unless-stopped
    profiles:
      - proxy

networks:
  doe-me-network:
    driver: bridge
    name: doe-me-network

volumes:
  node_modules:
    driver: local

