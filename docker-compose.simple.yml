version: '3.8'

services:
  # Frontend Vue.js - Desenvolvimento simples
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: doe-me-frontend-dev
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://host.docker.internal:8000/api
    restart: unless-stopped
    network_mode: bridge

volumes:
  node_modules:
    driver: local

